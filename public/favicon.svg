<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .dark { display: none }
    @media (prefers-color-scheme: dark) {
      .light { display: none }
      .dark { display: block }
    }
  </style>
  <image class="light" width="128" height="128" href="data:image/png;base64,"/>
  <image class="dark" width="128" height="128" href="data:image/png;base64,"/>
</svg>